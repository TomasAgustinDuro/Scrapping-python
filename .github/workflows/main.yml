name: Scrape Every 3 Hours

# El cron automático se desactivó: el portal bloquea las IPs de los runners
# de GitHub Actions (datacenter/cloud) a nivel de DNS/red. La ejecución
# programada ahora corre vía cron local (ver `crontab -l`), que usa una IP
# residencial y no está bloqueada. Este workflow queda solo para pruebas
# manuales puntuales.
on:
  workflow_dispatch: # Permite ejecutarlo manualmente para pruebas

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: scrapping

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run script
        env:
          MY_USERNAME: ${{ secrets.MY_USERNAME }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          ANOTHER_EMAIL: ${{ secrets.ANOTHER_EMAIL }}
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CI: "true"
        run: python scrapper_playwrigth.py
