name: Scrape Every 3 Hours

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: # Permite ejecutarlo manualmente también

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: scrapping

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run script
        env:
          MY_USERNAME: ${{ secrets.MY_USERNAME }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          ANOTHER_EMAIL: ${{ secrets.ANOTHER_EMAIL }}
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CI: "true"
        run: python scrapper_playwrigth.py

      - name: Persist heartbeat state
        if: always()
        run: |
          if ! git diff --quiet -- last_heartbeat.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_heartbeat.txt
            git commit -m "chore: actualiza last_heartbeat.txt [skip ci]"
            git push
          fi
